name: Fryer Radio

# Runs whenever new league data is published. Free on a public repo.
on:
  push:
    branches: [main]
    paths: [data/league.json]
  workflow_run:
    workflows: ["ESPN sync"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild this week's preview even if one exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fryer-radio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radio/requirements.txt

      - name: Install voice engine
        run: |
          pip install -r radio/requirements.txt
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Cache voice models
        id: models
        uses: actions/cache@v4
        with:
          path: radio/models
          key: kokoro-v1.0

      - name: Download voice models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p radio/models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL -o radio/models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          curl -fsSL -o radio/models/voices-v1.0.bin $base/voices-v1.0.bin

      - name: Build episodes
        env:
          # Optional. Add a free Gemini key as a repo secret to punch up the jokes.
          # Without it the template script is used. Facts are identical either way.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node radio/build.mjs ${{ inputs.force && '--force' || '' }}

      - name: Publish
        run: |
          git config user.name "Fryer Radio"
          git config user.email "fryer-radio@users.noreply.github.com"
          git add radio/episodes
          if git diff --cached --quiet; then echo "No new episodes."; exit 0; fi
          git commit -m "Fryer Radio: new episode"
          git push
